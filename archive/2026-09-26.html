<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Morning Digest — Saturday, September 26</title>
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --text: #1f1d1a; --muted: #6b665e;
    --line: #e7e2da; --accent: #b4532a; --accent-soft: #f6e7df; --top: #fff8f0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151412; --card: #1e1c1a; --text: #ece8e1; --muted: #9c968c;
      --line: #2e2b27; --accent: #e8875a; --accent-soft: #3a2a21; --top: #231d18;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { font: 700 30px/1.15 Georgia, "Times New Roman", serif; margin: 0 0 6px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); font-size: 15px; }
  header a { color: var(--accent); text-decoration: none; }
  h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
    margin: 40px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  h2.top { color: var(--accent); }
  article {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 18px 16px; margin-bottom: 12px;
  }
  .top-list article { background: var(--top); }
  article h3 { font-size: 19px; line-height: 1.3; margin: 0 0 6px; }
  article h3 a { color: inherit; text-decoration: none; }
  article h3 a:hover { color: var(--accent); }
  .meta { font-size: 13px; color: var(--muted); margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .dots { letter-spacing: 1px; color: var(--accent); }
  .dots span { opacity: 0.25; }
  .badge { font-size: 11px; background: var(--accent-soft); color: var(--accent); padding: 1px 7px; border-radius: 99px; }
  .summary { margin: 0; }
  .why { margin: 10px 0 0; font-size: 15px; color: var(--muted); }
  .why strong { color: var(--text); font-weight: 600; }
  details { margin-top: 10px; font-size: 15px; }
  summary { cursor: pointer; color: var(--accent); font-weight: 500; }
  details ul { margin: 8px 0 0; padding-left: 20px; }
  details li { margin-bottom: 4px; }
  .also { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
  .also a { color: var(--accent); text-decoration: none; }
  .quick ul { list-style: none; padding: 0; margin: 8px 0 0; }
  .quick li { padding: 9px 0; border-bottom: 1px solid var(--line); line-height: 1.35; }
  .quick li a { color: var(--text); text-decoration: none; font-weight: 500; }
  .quick li span { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
  footer { margin-top: 48px; font-size: 13px; color: var(--muted); text-align: center; }
  footer a { color: var(--accent); text-decoration: none; font-weight: 500; }
  @media (max-width: 480px) {
    main { padding-top: 24px; }
    header h1 { font-size: 26px; }
    article { padding: 16px 14px 14px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Good morning.</h1>
    <p>Saturday, September 26 · 0 stories</p>
    <p>Updated 6:00 AM · <a href="index.html">Past digests</a></p>
  </header>

</main>
</body>
</html>
